<script>
    // =========================================================================
    // CONFIGURACIÓN CENTRAL (PEGA AQUÍ TU NUEVA URL /exec DE APPS SCRIPT)
    // =========================================================================
    const API_URL = "PEGA_AQUI_TU_NUEVA_URL_DE_GOOGLE_APPS_SCRIPT_EXEC";

    const urlParams = new URLSearchParams(window.location.search);
    const TIENDA_ID = (urlParams.get("tienda") || "demo-konek").trim().toLowerCase();
    const AUTO_ADMIN_PASS = (urlParams.get("admin") || "").trim();

    let storeData = null;
    let allProducts = [];
    let activeCategory = "TODOS";
    let isAdmin = false;
    let adminPassword = "";
    let compressedBase64 = "";

    // 1. LECTOR UNIVERSAL POR IFRAME + POSTMESSAGE (Inmune a cuentas de trabajo y multi-sesión)
    const pendingRequests = {};
    window.addEventListener("message", function(event) {
      if (event.data && event.data.reqId && pendingRequests[event.data.reqId]) {
        const { resolve, timer, iframe } = pendingRequests[event.data.reqId];
        clearTimeout(timer);
        delete pendingRequests[event.data.reqId];
        if (iframe && iframe.parentNode) iframe.parentNode.removeChild(iframe);
        resolve(event.data.data);
      }
    });

    function universalGetRequest(params) {
      return new Promise((resolve, reject) => {
        const reqId = "req_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        params.reqId = reqId;
        const cleanBase = API_URL.trim().replace(/\/+$/, "");
        const sep = cleanBase.includes("?") ? "&" : "?";
        const query = Object.keys(params)
          .map(k => encodeURIComponent(k) + "=" + encodeURIComponent(params[k]))
          .join("&");

        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = cleanBase + sep + query;

        const timer = setTimeout(() => {
          delete pendingRequests[reqId];
          if (iframe && iframe.parentNode) iframe.parentNode.removeChild(iframe);
          reject(new Error("Tiempo de espera agotado al conectar con Google"));
        }, 15000);

        pendingRequests[reqId] = { resolve, reject, timer, iframe };
        document.body.appendChild(iframe);
      });
    }

    // 2. ESCRITURA UNIVERSAL POR FORMULARIO URLENCODED + NO-CORS (Inmune a Workspace)
    function universalPostRequest(payloadObj) {
      const formBody = new URLSearchParams();
      Object.keys(payloadObj).forEach(k => {
        if (payloadObj[k] !== undefined && payloadObj[k] !== null) {
          formBody.append(k, payloadObj[k]);
        }
      });

      return fetch(API_URL.trim(), {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formBody.toString()
      });
    }

    // 3. Cargar Tienda y Catálogo al abrir
    async function loadCatalog() {
      const grid = document.getElementById("productsGrid");
      try {
        const res = await universalGetRequest({ action: "getCatalog", tienda: TIENDA_ID });
        if (!res || !res.success) {
          document.getElementById("storeName").innerText = "Tienda no disponible";
          grid.innerHTML = `<div class="status-msg">⚠️ ${(res && res.error) ? res.error : "No se encontró el catálogo."}</div>`;
          return;
        }

        storeData = res.tienda;
        allProducts = res.productos || [];

        document.title = storeData.nombre + " • KonekShop";
        document.getElementById("storeName").innerText = storeData.nombre;
        document.documentElement.style.setProperty("--primary", storeData.color);
        document.documentElement.style.setProperty("--primary-dark", storeData.color);

        if (storeData.logo) {
          const logoEl = document.getElementById("storeLogo");
          logoEl.src = storeData.logo;
          logoEl.style.display = "block";
        }

        buildCategories();
        renderProducts();

        const savedPass = sessionStorage.getItem("konekshop_pass_" + TIENDA_ID) || AUTO_ADMIN_PASS;
        if (savedPass && !isAdmin) {
          verifyAdminSilently(savedPass);
        }

      } catch (err) {
        grid.innerHTML = `<div class="status-msg">❌ Error al cargar: ${err.message}</div>`;
      }
    }

    function buildCategories() {
      const bar = document.getElementById("categoriesBar");
      const datalist = document.getElementById("catSuggestions");
      const catsSet = new Set();

      allProducts.forEach(p => {
        if (p.categoria) catsSet.add(p.categoria.trim());
      });

      const cats = Array.from(catsSet);
      bar.innerHTML = `<button type="button" class="cat-pill ${activeCategory === 'TODOS' ? 'active' : ''}" onclick="filterByCategory('TODOS')">Todos (${allProducts.length})</button>`;
      datalist.innerHTML = "";

      cats.forEach(c => {
        const count = allProducts.filter(p => p.categoria.trim().toLowerCase() === c.toLowerCase()).length;
        const isActive = activeCategory.toLowerCase() === c.toLowerCase();
        bar.innerHTML += `<button type="button" class="cat-pill ${isActive ? 'active' : ''}" onclick="filterByCategory('${c.replace(/'/g, "\\'")}')">${c} (${count})</button>`;
        datalist.innerHTML += `<option value="${c}">`;
      });
    }

    function filterByCategory(cat) {
      activeCategory = cat;
      buildCategories();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      const search = document.getElementById("searchInput").value.trim().toLowerCase();

      const filtered = allProducts.filter(p => {
        const matchCat = (activeCategory === "TODOS") || (p.categoria.trim().toLowerCase() === activeCategory.toLowerCase());
        const matchText = !search ||
          p.nombre.toLowerCase().includes(search) ||
          (p.descripcion && p.descripcion.toLowerCase().includes(search)) ||
          (p.categoria && p.categoria.toLowerCase().includes(search));
        return matchCat && matchText;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="status-msg">🛍️ No hay productos para mostrar en esta categoría aún.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const imgUrl = p.imagenId
          ? `https://drive.google.com/thumbnail?sz=w600&id=${p.imagenId}`
          : `https://placehold.co/400x400/e2e8f0/64748b?text=Sin+Foto`;
        const precioFormateado = "$" + Number(p.precio).toLocaleString("es-MX", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        const waMsg = `¡Hola ${storeData.nombre}! Me interesa este producto de su catálogo:\n🛍️ *${p.nombre}*\n💲 Precio: ${precioFormateado}`;
        const waLink = `https://wa.me/${storeData.whatsapp}?text=${encodeURIComponent(waMsg)}`;

        return `
          <div class="prod-card">
            <button type="button" class="btn-del-prod" style="display:${isAdmin ? 'block' : 'none'};" onclick="deleteProduct('${p.id}', '${p.nombre.replace(/'/g, "\\'")}')" title="Eliminar producto">✕</button>
            <div class="prod-img-wrap" onclick="openDetail('${p.id}')">
              <span class="prod-cat-tag">${p.categoria}</span>
              <img src="${imgUrl}" loading="lazy" alt="${p.nombre}">
            </div>
            <div class="prod-body">
              <div>
                <div class="prod-title">${p.nombre}</div>
                <div class="prod-desc">${p.descripcion || ""}</div>
              </div>
              <div>
                <div class="prod-price">${precioFormateado}</div>
                <a href="${waLink}" target="_blank" class="btn-order-wa">📲 Pedir</a>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function openDetail(prodId) {
      const p = allProducts.find(item => String(item.id) === String(prodId));
      if (!p) return;

      const imgUrl = p.imagenId
        ? `https://drive.google.com/thumbnail?sz=w1000&id=${p.imagenId}`
        : `https://placehold.co/600x600/e2e8f0/64748b?text=Sin+Foto`;
      const precioFormateado = "$" + Number(p.precio).toLocaleString("es-MX", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      const waMsg = `¡Hola ${storeData.nombre}! Me interesa este producto de su catálogo:\n🛍️ *${p.nombre}*\n💲 Precio: ${precioFormateado}`;

      document.getElementById("detailImg").src = imgUrl;
      document.getElementById("detailCat").innerText = p.categoria;
      document.getElementById("detailTitle").innerText = p.nombre;
      document.getElementById("detailPrice").innerText = precioFormateado;
      document.getElementById("detailDesc").innerText = p.descripcion || "Consulta disponibilidad y formas de entrega por WhatsApp.";
      document.getElementById("detailWaBtn").href = `https://wa.me/${storeData.whatsapp}?text=${encodeURIComponent(waMsg)}`;
      document.getElementById("detailModal").style.display = "flex";
    }

    function cerrarModales() {
      document.getElementById("loginModal").style.display = "none";
      document.getElementById("detailModal").style.display = "none";
    }

    async function verifyAdminSilently(pass) {
      const res = await universalGetRequest({ action: "checkAdmin", tienda: TIENDA_ID, pass: pass });
      if (res && res.success) {
        activateAdminMode(pass);
      }
    }

    function activateAdminMode(pass) {
      isAdmin = true;
      adminPassword = pass;
      sessionStorage.setItem("konekshop_pass_" + TIENDA_ID, pass);
      document.getElementById("adminPanel").style.display = "block";
      const lockBtn = document.getElementById("btnAdminLock");
      lockBtn.innerText = "🔓";
      lockBtn.classList.add("unlocked");
      cerrarModales();
      renderProducts();
    }

    document.getElementById("btnAdminLock").addEventListener("click", () => {
      if (isAdmin) {
        const panel = document.getElementById("adminPanel");
        panel.style.display = panel.style.display === "none" ? "block" : "none";
      } else {
        document.getElementById("loginError").innerText = "";
        document.getElementById("adminPassInput").value = "";
        document.getElementById("loginModal").style.display = "flex";
        setTimeout(() => document.getElementById("adminPassInput").focus(), 100);
      }
    });

    document.getElementById("btnVerifyPass").addEventListener("click", async () => {
      const pass = document.getElementById("adminPassInput").value.trim();
      const errEl = document.getElementById("loginError");
      if (!pass) { errEl.innerText = "Escribe tu contraseña."; return; }

      errEl.style.color = "#0ea5e9";
      errEl.innerText = "Verificando...";
      const res = await universalGetRequest({ action: "checkAdmin", tienda: TIENDA_ID, pass: pass });
      if (res && res.success) {
        activateAdminMode(pass);
      } else {
        errEl.style.color = "#ef4444";
        errEl.innerText = "❌ Contraseña incorrecta.";
      }
    });

    document.getElementById("btnLogout").addEventListener("click", () => {
      isAdmin = false;
      adminPassword = "";
      sessionStorage.removeItem("konekshop_pass_" + TIENDA_ID);
      document.getElementById("adminPanel").style.display = "none";
      const lockBtn = document.getElementById("btnAdminLock");
      lockBtn.innerText = "🔒";
      lockBtn.classList.remove("unlocked");
      renderProducts();
    });

    document.getElementById("prodPhoto").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const maxDim = 850;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }

          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          compressedBase64 = canvas.toDataURL("image/jpeg", 0.80);

          const prev = document.getElementById("previewImg");
          prev.src = compressedBase64;
          prev.style.display = "block";
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("formAddProduct").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmitProd");
      const status = document.getElementById("adminStatus");

      const payload = {
        action: "addProduct",
        tienda: TIENDA_ID,
        pass: adminPassword,
        nombre: document.getElementById("prodName").value.trim(),
        precio: document.getElementById("prodPrice").value.trim(),
        categoria: document.getElementById("prodCategory").value.trim(),
        descripcion: document.getElementById("prodDesc").value.trim(),
        imagenBase64: compressedBase64
      };

      btn.disabled = true;
      status.style.color = "#38bdf8";
      status.innerText = "⏳ Subiendo producto al catálogo...";

      try {
        await universalPostRequest(payload);
        // Esperar 2.5 segundos a que Google Drive guarde la foto y recargar catálogo
        await new Promise(r => setTimeout(r, 2500));
        status.style.color = "#4ade80";
        status.innerText = "✅ ¡Producto publicado!";
        document.getElementById("formAddProduct").reset();
        document.getElementById("previewImg").style.display = "none";
        compressedBase64 = "";
        await loadCatalog();
        setTimeout(() => { status.innerText = ""; }, 3000);
      } catch (err) {
        status.style.color = "#ef4444";
        status.innerText = "❌ Error de red: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });

    async function deleteProduct(productId, productName) {
      if (!confirm(`¿Seguro que deseas eliminar "${productName}" del catálogo?`)) return;

      try {
        await universalPostRequest({
          action: "deleteProduct",
          tienda: TIENDA_ID,
          pass: adminPassword,
          productId: productId
        });
        await new Promise(r => setTimeout(r, 1500));
        await loadCatalog();
      } catch (err) {
        alert("Error de conexión al eliminar.");
      }
    }

    document.getElementById("searchInput").addEventListener("input", renderProducts);
    window.addEventListener("DOMContentLoaded", loadCatalog);
  </script>
</body>
</html>
